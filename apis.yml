name: Payworks
description: Payworks was a Munich-based payment-infrastructure company backed by Speedinvest, building
  a mobile point-of-sale (mPOS) payment-gateway platform that let acquirers, PSPs and ISVs turn commodity
  smartphones and tablets into card-accepting terminals via a developer SDK and gateway. It was acquired
  by Visa in 2019 and its technology was folded into Visa's acceptance/CyberSource stack, after which the
  independent Payworks brand was wound down. As of this enrichment pass the company operates no active
  independent public developer surface — its primary domains are dormant (payworks.com resolves to a parked
  AWS S3 redirect bucket with no website configuration; payworks.de is a domain-for-sale parking page) and
  no docs/developer/api subdomains resolve — so there is no live OpenAPI, SDK, or documentation surface to
  harvest into the network. This profile is retained as a historical Speedinvest portfolio record.
